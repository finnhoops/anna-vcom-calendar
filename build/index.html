  }
  left.appendChild(el("p",{class:"today-meta", text:meta}));
  head.appendChild(left);

  /* The exam card, in every state of the block including before it starts. It
     used to count down to day one instead while pre-term, on the reasoning that
     there is no exam worth counting to yet; Finn wanted the exams there too, and
     nothing is lost -- the meta line on the left of this panel already reads
     "First day is Wednesday, September 2." Same card as the day view's, so the
     two are always identical. */
  head.appendChild(countdownCard(TODAY));
  host.appendChild(head);

  const body = el("div",{class:"today-body"});
  const schedCol = el("div",{class:"today-col"});
  const showDate = preTerm ? DATA.meta.term_start : ts;
  schedCol.appendChild(el("div",{class:"colhead"},[
    el("span",{text: preTerm ? "First day’s schedule" : "Schedule"}),
    el("div",{class:"headbtns"},[
      editToggle("sched"),
      el("button",{class:"btn ghost sm", type:"button", text:"Add",
        onclick:() => sessionModal(null, showDate)})
    ])
  ]));
  if(EDIT.sched) schedCol.appendChild(el("p",{class:"edithint",
    text:"Tap a class to change its name or time. ✕ takes it off this day — nothing is lost, it comes back from the strip underneath."}));
  schedCol.appendChild(scheduleList(showDate, preTerm));
  body.appendChild(schedCol);

  const taskCol = el("div",{class:"today-col"});
  taskCol.appendChild(el("div",{class:"colhead"},[
    el("span",{text:"To-do"}),
    el("div",{class:"headbtns"},[editToggle("todo")])
  ]));
  if(EDIT.todo) taskCol.appendChild(el("p",{class:"edithint",
    text:"✕ removes a box from this day, and the arrows move your own to-dos up and down. Anything removed comes back from the strip at the bottom."}));
  taskCol.appendChild(taskList(ts));
  body.appendChild(taskCol);
  host.appendChild(body);
}

function scheduleList(dateStr, isPreview){
  const list = sessionsFor(dateStr);
  const box = el("div",{});
  if(!list.length){
    box.appendChild(el("div",{class:"empty"},[
      el("strong",{text:"Nothing scheduled."}),
      "No classes on the block schedule for this day. Use Add if something belongs here."
    ]));
  }else{
    list.forEach((s,i) => {
      const row = el("div",{class:"slot" + (EDIT.sched ? " editing" : "")});
      row.appendChild(el("p",{class:"time", text:fmtTime(s.start)}));
      row.appendChild(sessionButton(s, dateStr));
      /* The row itself is still the edit target in edit mode -- one control per
         row, not two, because a 375px slot has no room for a pencil beside an
         ✕ and the row is already the bigger, more obvious target. */
      if(EDIT.sched) row.appendChild(rmBtn(`Remove “${sessStamp(s)}” from this day`, () => hideSession(s, dateStr)));
      if(!isPreview) row.style.animationDelay = `${Math.min(i*35,280)}ms`;
      box.appendChild(row);
    });
  }
  if(EDIT.sched){
    const strip = restoreStrip("Removed from this day",
      hiddenFor(dateStr).map(s => ({text:sessStamp(s), undo:() => unhideSession(s, dateStr)})));
    if(strip) box.appendChild(strip);
  }
  return box;
}

function sessionButton(s, dateStr){
  const cat = catColor(s);
  const b = el("button",{
    class:"sess"+(s.kind==="exam"?" is-exam":"")+(s.kind==="break"?" is-break":"")+(s._edited?" edited":""),
    type:"button",
    style:`--cat:var(--cat-${cssKey(cat)})`,
    onclick:() => sessionModal(s, dateStr)
  });
  const nm = el("p",{class:"nm"});
  nm.appendChild(document.createTextNode(s.label || s.title));
  if(s.mandatory) nm.appendChild(el("span",{class:"tag tag-mand", text:"Required", style:`--cat:var(--cat-${cssKey(cat)})`}));
  b.appendChild(nm);
  /* Under the name: what the class is actually on. The time is already in the
     left column and the instructor is noise here, so neither is repeated --
     just the topic, and only when it says something the name doesn't. */
  const sub = sessionSubtitle(s);
  if(sub) b.appendChild(el("p",{class:"dt", text:sub}));
  else if(s.location) b.appendChild(el("p",{class:"dt", text:titleish(s.location)}));
  return b;
}
const cssKey = c => c.toLowerCase().replace(/[^a-z0-9]+/g,"-");
const cat_key = cssKey;
const titleish = t => t.replace(/\w\S*/g, w => w[0].toUpperCase()+w.slice(1).toLowerCase());

/* The topic line shown under a class name in the today panel, the day view and
   the week grid. `label` is the name ("Anatomy #1", "Anatomy Lab"); `title` is
   the topic ("Introduction to Clinical Anatomy", "Brain, Spinal Cord & Cranial
   Nerves"). Returns "" when the topic would only echo the name -- LUNCH, exams,
   and the Clinical Skills practicals that are already named by what they are
   ("Clinical Skills- Sterility Techniques") -- so those read exactly as before. */
function sessionSubtitle(s){
  const t = (s.title || "").trim();
  if(!t || s.kind === "break") return "";
  const norm = x => x.toLowerCase().replace(/[^a-z0-9]+/g,"");
  const nt = norm(t), nl = norm(s.label || "");
  if(!nt || !nl || nl.includes(nt) || nt.includes(nl)) return "";
  return t;
}

/* ---------------------------------------------------------------------------
   Study workflow. The before/after checklists are generated from whichever
   lectures that day qualifies (the parser sets `study`), so they follow the
   schedule automatically. The middle section is the same every day.
   Tick state is keyed by date + phase + session id and kept apart from manual
   to-dos, so rebuilding from a new PDF never disturbs either one.
   ------------------------------------------------------------------------ */
const DURING_LEAD = "Label lectures as the following";
const DURING_STEPS = [
  {hl:"yellow", head:"Yellow = Memorize",
   body:"definitions, numbers, lists, structures, formulas, clear-cut facts"},
  {hl:"blue", head:"Blue = Important / Understand / High Priority",
   body:"professor emphasis, testable/high-yield information, mechanisms, relationships, cause-and-effect, important concepts"},
  {hl:"pink", head:"Pink = Confused",
   body:"don’t waste lecture time figuring it out; mark it and keep listening"}
];
const AFTER_STEPS = [
  "Look at pink labeled notes → figure it out → recolor yellow or blue",
  "Send ChatGPT the marked up lecture and say → “Make my Post-Lecture Anki.” (Memorization cards & Understanding cards)",
  "Put into Anki",
  "Go through the created cards"
];

const studyLectures = dateStr => sessionsFor(dateStr).filter(s => s.study && s.todoLabel);

/* Each phase is a disclosure. The open/closed choice is per phase and global,
   not per day: a section Anna folds away stays folded on every day, which is
   the point of folding it. During-lecture starts closed because it is the same
   reference text every day; the two tickable phases start open.
   `aria-controls` ids are uniquified -- the today panel and the day view can
   both be showing the same date at once, so studyBlock runs twice. */
const PHASES = {tests:"Upcoming Tests", recall:"Daily Tasks",
                before:"Before lecture tasks", during:"During lecture tasks",
                after:"After lecture tasks"};
const CHEV = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
let discSeq = 0;

/* Toggling updates the DOM in place rather than re-rendering, so focus stays on
   the header Anna just pressed and both copies of the section stay in step. */
function setOpen(phase, open){
  S.open[phase] = open;
  persist();
  document.querySelectorAll('.tdtoggle[data-phase="'+phase+'"]').forEach(btn => {
    btn.setAttribute("aria-expanded", String(open));
    const body = document.getElementById(btn.getAttribute("aria-controls"));
    if(!body) return;
    body.hidden = !open;
    if(open){ body.classList.remove("anim"); void body.offsetWidth; body.classList.add("anim"); }
  });
  announce(`${PHASES[phase]} ${open ? "expanded" : "collapsed"}.`);
}

function disclosure(phase, done, total){
  const id = `td-${phase}-${++discSeq}`;
  const open = !!S.open[phase];
  const label = total
    ? `${PHASES[phase]}, ${done} of ${total} done`
    : PHASES[phase];
  const btn = el("button",{
    class:"tdtoggle", type:"button", "data-phase":phase, "aria-label":label,
    "aria-expanded":String(open), "aria-controls":id,
    onclick:() => setOpen(phase, !S.open[phase])
  });
  btn.appendChild(el("span",{class:"chev", html:CHEV}));
  btn.appendChild(el("span",{class:"tdlabel", text:PHASES[phase]}));
  if(total) btn.appendChild(el("span",{
    class:"tdcount"+(done===total ? " all" : ""), "aria-hidden":"true", text:`${done}/${total}`
  }));

  const sec = el("section",{class:"tdsec"});
  sec.appendChild(el("h4",{}, btn));
  const body = el("div",{class:"tdbody", id:id});
  body.hidden = !open;
  sec.appendChild(body);
  return {sec, body};
}

const genCheck = (dateStr, phase, session, label) =>
  checkRow(`${dateStr}|${phase}|${session.id}`, phase, label || session.todoLabel);

/* Returns null when Anna has taken this box off the day. Every caller has to
   cope with that -- they filter -- which is why the counts on the disclosure
   headers are computed from the surviving rows rather than from the lecture
   list they came from. */
function checkRow(id, phase, text){
  if(S.genHidden[id]) return null;
  const done = !!S.gen[id];
  const row = el("div",{class:"task gen"+(done?" done":"")});
  row.appendChild(el("button",{
    class:"check", role:"checkbox", type:"button",
    "aria-checked":String(done),
    "aria-label":`${PHASES[phase]} — ${text}`,
    onclick:() => {
      if(S.gen[id]) delete S.gen[id]; else S.gen[id] = true;
      persist(); render();
      announce(S.gen[id] ? "Marked done." : "Marked not done.");
    }
  }));
  row.appendChild(el("span",{class:"txt", text:text}));
  if(EDIT.todo) row.appendChild(rmBtn(`Remove “${text}” from this day`, () => {
    S.genHidden[id] = text;              // the label, so the restore strip can name it
    persist(); render();
    announce("Removed from this day. Restore it under Edit.");
  }));
  return row;
}

/* Chat Recall, from STUDY 1.0: the day after a lecture, sit down and recall it.
   `yesterday` is the previous CALENDAR day, not the previous teaching day, which
   is what Finn asked for and is also what a one-day spacing means -- so Friday's
   lectures surface on Saturday, and a Monday after a quiet Sunday carries no
   recall.

   It is ONE box naming the day -- "Chat Recall from 9/8" -- not a box per
   lecture. It listed every lecture at first and Finn cut it back: six boxes
   saying the same thing in six ways is a worse prompt than one saying it once.
   The lectures are still worked out, because whether the day had any qualifying
   ones at all is what decides if the box appears. */
const recallLectures = dateStr => studyLectures(iso(addDays(fromIso(dateStr), -1)));

/* Anki review lists the qualifying lectures taught EXACTLY two days ago -- the
   day after their Chat Recall. It does not accumulate and it does not care about
   exams; Finn chose that over a running backlog after seeing what the backlog
   did. Two consequences worth knowing before "fixing" either:

   - A day whose two-days-ago taught nothing gets **no Anki box at all**. Monday
     is usually that day, because Saturday rarely teaches.
   - The box can name a lecture whose exam is tomorrow. That is fine: the exam
     run-up in Upcoming Tests is what handles the last five days.

   The accumulating version had a real hole, which is what surfaced this: a
   lecture became eligible two days after it was taught but dropped five days
   before its exam, so any lecture taught inside seven days of its own exam was
   never listed once. That was 26 of the block's 106 lectures, Anatomy #3-#5
   among them -- the ones Finn noticed missing on 12 September.

   Clinical Skills ALA is excluded here and only here; it is still in Chat Recall
   and in the before/after boxes. */
const ANKI_LAG  = 2;
const ANKI_SKIP = ["CLINICAL SKILLS"];
/* A standing daily box on EVERY day of the block, weekends included -- it is a
   backlog, so a quiet Saturday still carries one. It ran from a hardcoded
   2026-09-11 until 2026-08-27, which was the only date in the whole to-do engine
   not derived from the schedule and so the only thing that would not have
   followed a new block. Finn chose "every day, from day one" over an offset into
   the block, which means there is now no date here to carry over and nothing to
   check when a new PDF is parsed.

   The bounds are the block's own, so days outside it get no box: before day one
   there is nothing to have made cards from, and after the last day the block is
   over. */
const inBlock = dateStr =>
  dateStr >= DATA.meta.term_start && dateStr <= DATA.meta.term_end;

function ankiLectures(dateStr){
  const src = iso(addDays(fromIso(dateStr), -ANKI_LAG));
  /* Grouped by course, then by lecture number -- the only order that stays
     scannable when several run together on one line. */
  return studyLectures(src)
    .filter(s => !ANKI_SKIP.includes((s.category || "").toUpperCase()))
    .sort((a, b) =>
      a.todoLabel.replace(/\s*#\d+$/, "").localeCompare(b.todoLabel.replace(/\s*#\d+$/, ""))
      || (parseInt(a.todoLabel.match(/#(\d+)$/)?.[1] || 0)
          - parseInt(b.todoLabel.match(/#(\d+)$/)?.[1] || 0)));
}

/* Upcoming Tests. "Days out" counts the way Finn does: one day out is the day
   BEFORE the test, so five days out from a Wednesday exam is the Friday before.
   The window opens at TEST_WINDOW and the exam day itself is not in it.

   This used to hand off from the Anki review line, which dropped a lecture as its
   exam's window opened. That coupling is gone -- Anki review now lists only the
   lectures from exactly two days back and ignores exams entirely -- so the two
   overlap freely, and a lecture can sit on the Anki line while its exam is in
   its run-up. That is intended, not a leak.

   EVERY exam appears, not only the ones that state a lecture range: the Clinical
   Skills practicals, the OSCE stations and the Drug Card exam examine a skill
   rather than a numbered run of lectures, so they simply get their name with no
   brackets after it. `DATA.recallExams` is that list, built by the generator --
   deduplicated, because the PDF lists two of the practicals twice, once bare and
   once with the instructors and room run into the title. */
const TEST_WINDOW = 5;

function upcomingTests(dateStr){
  const today = fromIso(dateStr);
  return DATA.recallExams
    .map(e => ({e, out: Math.round((fromIso(e.date) - today) / 86400000)}))
    .filter(x => x.out >= 1 && x.out <= TEST_WINDOW)   // never the exam day itself
    .sort((a, b) => a.out - b.out || a.e.examTitle.localeCompare(b.e.examTitle));
}

/* What each day of the run-up asks for, keyed by how many days out it is.

   `ranged` splits the exams that state a lecture range from the practicals, the
   OSCE stations and the Drug Card exam, which state none. They are not the same
   task and they do not read the same: a ranged exam names the lectures it covers
   in brackets, and a practical is just a practical.

   `null` means that day asks nothing of that exam, and a day where nothing is
   asked of any exam does not render the section at all -- an empty dropdown is
   worse than no dropdown.

   All five days are now specified: 5 and 4 from Finn, 3 from Finn, 2 and 1 from
   Anna on 2026-08-27. `plain` is null on 4, 3, 2 and 1 -- a practical states no
   lecture range, and every one of those four wordings puts one in brackets, so
   there is nothing to render. Only day 5 asks anything of a practical. If Anna
   wants the practicals prompted later in the run-up, that is a wording from her
   per day, not something to invent here. */
const chatRecall = e => `Chat test recall: ${e.examTitle} (${e.lectureLabel})`;

const TEST_RUNUP = {
  5: {
    ranged:  chatRecall,
    plain:   e => `5 days before test: ${e.examTitle}`,
  },
  4: {
    // Deliberately the SAME wording as day five, sharing one function so the two
    // cannot drift apart. Day four briefly read "Chat test recall and weakness
    // list" and Finn replaced that with a plain repeat; the weakness list moved
    // to day three and got "Extreme" in front of it.
    ranged:  chatRecall,
    plain:   null,
  },
  3: {
    ranged:  e => `Extreme chat test recall and weakness list: ${e.examTitle} (${e.lectureLabel})`,
    plain:   null,
  },
  2: {
    // Anna's wording, verbatim, capitalisation included (2026-08-27).
    ranged:  e => `Extreme Chat test Recall + Focus on weak list: ${e.examTitle} (${e.lectureLabel})`,
    plain:   null,
  },
  1: {
    // The day BEFORE the exam. Anna's wording, verbatim; the exam name and its
    // lecture range go where she wrote ### and the arrow is hers.
    ranged:  e => `DAY BEFORE EXAM ${e.examTitle} (${e.lectureLabel}) \u2192 Work on focused/weak concepts + do some anki if you have time`,
    plain:   null,
  },
};

function testTasks(dateStr, entry){
  const {e, out} = entry;
  const spec = TEST_RUNUP[out];
  if(!spec) return [];
  const build = spec[e.lectureLabel ? "ranged" : "plain"];
  if(!build) return [];
  return [checkRow(`${dateStr}|test|${e.date}|${e.examTitle}|${out}`, "tests", build(e))].filter(Boolean);
}

function testsBlock(dateStr){
  const rows = [];
  let done = 0;
  for(const entry of upcomingTests(dateStr)){
    for(const row of testTasks(dateStr, entry)){
      if(row.classList.contains("done")) done++;
      rows.push(row);
    }
  }
  if(!rows.length) return null;
  const sec = disclosure("tests", done, rows.length);
  rows.forEach(r => sec.body.appendChild(r));
  return sec.sec;
}

function studyBlock(dateStr){
  const lectures = studyLectures(dateStr);
  const recall = recallLectures(dateStr);
  const anki = ankiLectures(dateStr);
  const tests = testsBlock(dateStr);
  // A day can carry Daily Tasks or Upcoming Tests with no lectures of its own --
  // a Saturday after a teaching Friday is exactly that -- so this cannot bail on
  // `lectures` alone.
  if(!lectures.length && !recall.length && !anki.length && !tests
     && !inBlock(dateStr)) return null;
  /* Counts come from the rows that survive Anna's removals, not from the
     lecture list -- otherwise a header reads "0/6" over four boxes. */
  const genId = (phase, s) => `${dateStr}|${phase}|${s.id}`;
  const shown = phase => lectures.filter(s => !S.genHidden[genId(phase, s)]);
  const doneIn = (phase, list) => list.filter(s => S.gen[genId(phase, s)]).length;


  const box = el("div",{class:"study"});

  /* An exam inside its window outranks the daily routine, so it leads. */
  if(tests) box.appendChild(tests);

  /* Recall comes first: it is yesterday's material, so it reads oddly after
     three sections about today's. */
  const standing = inBlock(dateStr);
  if(recall.length || anki.length || standing){
    const rows = [];
    if(recall.length){
      rows.push(checkRow(`${dateStr}|recall`, "recall",
        `Chat Recall from ${shortDate(iso(addDays(fromIso(dateStr), -1)))}`));
    }
    if(anki.length){
      rows.push(checkRow(`${dateStr}|anki`, "recall",
        `Anki review: ${anki.map(s => s.todoLabel).join(", ")}`));
    }
    if(standing){
      rows.push(checkRow(`${dateStr}|ankicards`, "recall",
        "Remaining Anki memorization cards"));
    }
    const live = rows.filter(Boolean);
    if(live.length){
      const rc = disclosure("recall", live.filter(r => r.classList.contains("done")).length,
                            live.length);
      live.forEach(r => rc.body.appendChild(r));
      box.appendChild(rc.sec);
    }
  }
  if(!lectures.length) return box.children.length ? box : null;

  /* A phase whose every box has been removed renders no section at all, for the
     same reason testsBlock returns null on no rows: an empty dropdown is worse
     than no dropdown. The restore strip is what gets them back. */
  const bl = shown("before");
  if(bl.length){
    const before = disclosure("before", doneIn("before", bl), bl.length);
    bl.forEach(s => before.body.appendChild(genCheck(dateStr,"before",s)));
    box.appendChild(before.sec);
  }

  const during = disclosure("during", 0, 0);
  const dl = el("ul",{class:"steps"});
  dl.appendChild(el("li",{class:"lead", text:DURING_LEAD}));
  DURING_STEPS.forEach(step => {
    const li = el("li",{});
    li.appendChild(el("span",{class:"hl", text:step.head, style:`--hlc:var(--hl-${step.hl})`}));
    li.appendChild(document.createTextNode(" → " + step.body));
    dl.appendChild(li);
  });
  during.body.appendChild(dl);
  box.appendChild(during.sec);

  const afl = shown("after");
  const after = disclosure("after", doneIn("after", afl), afl.length);
  const al = el("ul",{class:"steps"});
  AFTER_STEPS.forEach(t => al.appendChild(el("li",{text:t})));
  after.body.appendChild(al);
  afl.forEach(s => after.body.appendChild(genCheck(dateStr,"after",s)));
  box.appendChild(after.sec);

  return box.children.length ? box : null;
}

/* ---- tasks ------------------------------------------------------------- */
function taskList(dateStr){
  const box = el("div",{});
  const items = S.tasks[dateStr] || [];
  const study = studyBlock(dateStr);
  if(study){
    box.appendChild(study);
    box.appendChild(el("h4",{class:"tdsec-own", text:"My to-dos"}));
  }
  if(!items.length && !study){
    box.appendChild(el("div",{class:"empty"},[
      el("strong",{text:"No to-dos yet."}),
      "Add what this day actually needs — study blocks, errands, anything. Items stay on this day."
    ]));
  }
  items.forEach((t, i) => {
    const row = el("div",{class:"task"+(t.done?" done":"")+(EDIT.todo?" editing":"")});
    row.appendChild(el("button",{
      class:"check", role:"checkbox", type:"button",
      "aria-checked":String(!!t.done), "aria-label":`Mark “${t.text}” ${t.done?"not done":"done"}`,
      onclick:() => { t.done = !t.done; persist(); render(); announce(t.done?"Marked done.":"Marked not done."); }
    }));
    row.appendChild(el("span",{
      class:"txt", text:t.text, role:"textbox", tabindex:"0", contenteditable:"true",
      onblur:e => { const v=e.target.textContent.trim(); if(v){ t.text=v; } else { e.target.textContent=t.text; } persist(); },
      onkeydown:e => { if(e.key==="Enter"){ e.preventDefault(); e.target.blur(); } }
    }));
    if(EDIT.todo){
      /* Arrows, not drag. Dragging a 32px row on a phone fights the page scroll,
         and arrows are the only version of this that also works from a keyboard. */
      row.appendChild(el("button",{
        class:"move", type:"button", disabled: i===0 || null,
        "aria-label":`Move “${t.text}” up`, title:"Move up", html:ICON_UP,
        onclick:() => moveTask(dateStr, i, -1)
      }));
      row.appendChild(el("button",{
        class:"move", type:"button", disabled: i===items.length-1 || null,
        "aria-label":`Move “${t.text}” down`, title:"Move down", html:ICON_DOWN,
        onclick:() => moveTask(dateStr, i, 1)
      }));
      row.appendChild(rmBtn(`Delete “${t.text}”`, () => {
        S.tasks[dateStr] = items.filter(x => x !== t);
        persist(); render(); announce("To-do deleted.");
      }));
    }else{
      /* The hover-revealed original, kept for the pointer case. On touch the CSS
         forces it visible; edit mode replaces it outright with the bordered set
         above so the three controls match. */
      row.appendChild(el("button",{
        class:"del", type:"button", "aria-label":`Delete “${t.text}”`,
        html:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>',
        onclick:() => { S.tasks[dateStr] = items.filter(x => x!==t); persist(); render(); announce("To-do deleted."); }
      }));
    }
    box.appendChild(row);
  });

  /* Generated boxes hide rather than delete -- they are regenerated from the
     schedule every render, so "delete" could only ever mean "not on this day". */
  if(EDIT.todo){
    const pre = dateStr + "|";
    const strip = restoreStrip("Removed from this day",
      Object.keys(S.genHidden).filter(k => k.indexOf(pre) === 0).map(k => ({
        text:S.genHidden[k],
        undo:() => { delete S.genHidden[k]; persist(); render(); announce("Put back."); }
      })));
    if(strip) box.appendChild(strip);
  }

  const form = el("form",{class:"addrow", onsubmit:e => {
    e.preventDefault();
    const input = form.querySelector("input");
    const v = input.value.trim();
    if(!v) return;
    (S.tasks[dateStr] = S.tasks[dateStr] || []).push({id:"t"+Date.now(), text:v, done:false, source:"manual"});
    input.value = ""; persist(); render();
    announce("To-do added.");
    document.querySelectorAll(".addrow input").forEach(i => { if(i.dataset.d===dateStr) i.focus(); });
  }});
  form.appendChild(el("input",{type:"text", placeholder:"Add a to-do…", "aria-label":"New to-do", "data-d":dateStr}));
  form.appendChild(el("button",{class:"btn sm", type:"submit", text:"Add"}));
  box.appendChild(form);
  return box;
}

function moveTask(dateStr, i, dir){
  const arr = S.tasks[dateStr];
  if(!arr) return;
  const j = i + dir;
  if(j < 0 || j >= arr.length) return;
  const t = arr[i];
  arr[i] = arr[j]; arr[j] = t;
  persist(); render();
  announce(`Moved “${t.text}” ${dir < 0 ? "up" : "down"}.`);
}

/* ---- month ------------------------------------------------------------- */
let cursor = new Date(TODAY);

function renderMonth(){
  const host = el("div",{class:"month"});
  const dow = el("div",{class:"dow"});
  dow.appendChild(el("span",{text:"Wk", title:"Week"}));
  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(d => dow.appendChild(el("span",{text:d})));
  host.appendChild(dow);

  const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
  let d = startOfWeek(first);
  for(let w=0; w<6; w++){
    const row = el("div",{class:"mrow"});
    const weekStart = new Date(d);
    const wkNo = DATA.days[iso(weekStart)]?.week;
    row.appendChild(el("button",{
      class:"wk", type:"button", text: wkNo ? String(wkNo) : "·",
      "aria-label":`Week of ${MONTHS[weekStart.getMonth()]} ${weekStart.getDate()}`,
      onclick:() => { cursor = weekStart; setView("week"); }
    }));
    for(let i=0;i<7;i++){
      row.appendChild(monthCell(d, cursor.getMonth()));
      d = addDays(d,1);
    }
    host.appendChild(row);
    if(d.getMonth() !== cursor.getMonth() && d > new Date(cursor.getFullYear(), cursor.getMonth()+1, 0)) break;
  }
  return host;
}

function monthCell(date, month){
  const ds = iso(date);
  const list = sessionsFor(ds).filter(s => s.kind!=="break");
  const info = DATA.days[ds];
  const isToday = sameDay(date, TODAY);
  const editing = EDIT.grid;
  const stamp = `${DAYNAMES[date.getDay()]} ${MONTHS[date.getMonth()]} ${date.getDate()}`;
  const cell = el("button",{
    class:"day"+(date.getMonth()!==month?" out":"")+(isToday?" today":"")+([5,6].includes((date.getDay()+6)%7)?" weekend":"")+(editing?" editable":""),
    type:"button",
    "aria-label": editing ? `Edit ${stamp}` : `${stamp}, ${list.length} scheduled`,
    /* In edit mode a day opens the sheet instead of navigating. The cell is
       45px wide on a phone, so it can carry one gesture and only one -- and
       while Edit is on, editing is the one you asked for. */
    onclick:() => { if(editing) dayEditor(ds); else { cursor = new Date(date); setView("day"); } }
  });
  cell.appendChild(el("span",{class:"num", text:String(date.getDate())}));
  if(editing) cell.appendChild(el("span",{class:"pencil", "aria-hidden":"true", html:ICON_PEN}));

  /* The red exam chip is sourced from DATA.exams -- the schedule's own exam
     list -- not from the day's sessions, so a test still shows its rectangle
     here even if that session was removed from the day in edit mode on this
     device. Falls back to a session of kind "exam" for anything added by hand. */
  const examName = (() => {
    const e = (DATA.exams || []).find(x => x.date === ds);
    if(e) return e.label || e.title || "Exam";
    const s = list.find(x => x.kind === "exam");
    if(s) return s.label || "Exam";
    // OSCE sessions are assessments -- show them with the exams on the month grid.
    const osce = list.find(x => /^(OSCE #|CLINICAL SKILLS OSCE)/.test((x.label || "").toUpperCase()));
    if(osce) return /^OSCE #/i.test(osce.label || "") ? osce.label : "OSCE Exam";
    return null;
  })();
  if(examName){
    cell.appendChild(el("span",{class:"chip", text:examName, style:`--cat:var(--cat-exam)`}));
  }else if(list.length){
    const dots = el("div",{class:"dots"});
    [...new Set(list.map(catColor))].slice(0,6).forEach(c =>
      dots.appendChild(el("span",{class:"dot", style:`--cat:var(--cat-${cssKey(c)})`})));
    cell.appendChild(dots);
  }
  const tasks = (S.tasks[ds]||[]).filter(t => !t.done).length;
  const bits = [];
  if(list.length) bits.push(`${list.length} class${list.length>1?"es":""}`);
  if(tasks) bits.push(`${tasks} to-do`);
  /* A cell used to report "N assigned" here as well. That went when Finn had the
     "From the schedule" list taken out: the count had nowhere left to lead, and a
     number you cannot click through to is worse than no number. The assignments
     are still in data/schedule.json, so putting them back is a render away. */
  if(bits.length) cell.appendChild(el("p",{class:"cnt", text:bits.join(" · ")}));
  return cell;
}

/* ---- week -------------------------------------------------------------- */
const H_START = 8, H_END = 21, PX = 56;   // show the grid through 8 PM

function renderWeek(){
  const start = startOfWeek(cursor);
  const wrap = el("div",{class:"weekwrap"});
  const grid = el("div",{class:"weekgrid"});

  const head = el("div",{class:"whead"});
  head.appendChild(el("div",{text:""}));
  for(let i=0;i<7;i++){
    const d = addDays(start,i);
    const c = el("div",{class: sameDay(d,TODAY)?"is-today":""});
    c.appendChild(el("small",{text:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][i]}));
    c.appendChild(document.createTextNode(`${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`));
    /* The blocks in the grid are already tap-to-edit; what the week had no way
       to do was ADD. This is that, per day, and it opens the same sheet the
       month does so there is one thing to learn. */
    if(EDIT.grid) c.appendChild(el("button",{
      class:"btn ghost sm whedit", type:"button", text:"Edit",
      "aria-label":`Edit ${DAYNAMES[d.getDay()]} ${MONTHS[d.getMonth()]} ${d.getDate()}`,
      onclick:() => dayEditor(iso(d))
    }));
    head.appendChild(c);
  }
  grid.appendChild(head);

  const body = el("div",{class:"wbody"});
  const hours = el("div",{class:"hours"});
  for(let h=H_START; h<H_END; h++) hours.appendChild(el("div",{class:"hour", text:fmtTime(`${String(h).padStart(2,"0")}:00`)}));
  body.appendChild(hours);

  for(let i=0;i<7;i++){
    const d = addDays(start,i);
    const col = el("div",{class:"wcol"});
    const lines = el("div",{class:"lines"});
    for(let h=H_START; h<H_END; h++) lines.appendChild(el("div",{}));
    col.appendChild(lines);
    sessionsFor(iso(d)).forEach(s => {
      if(!s.start || !s.end) return;
      const top = (mins(s.start) - H_START*60) / 60 * PX;
      // A "strip" session (e.g. a 4 PM Zoom over an all-afternoon lab) is a thin
      // bar laid on top of whatever it overlaps, not a full-height block.
      const strip = !!s.strip;
      const height = strip ? 22 : Math.max((mins(s.end)-mins(s.start))/60*PX - 3, 22);
      if(top < -PX) return;
      const cat = catColor(s);
      const b = el("button",{
        class: strip ? "wsess strip" : "wsess", type:"button",
        style:`top:${top}px; height:${height}px; --cat:var(--cat-${cssKey(cat)})`,
        onclick:() => sessionModal(s, iso(d))
      });
      b.appendChild(el("p",{class:"n", text:s.label||s.title}));
      const wsub = strip ? "" : sessionSubtitle(s);
      if(wsub && height > 40) b.appendChild(el("p",{class:"t", text:wsub}));
      col.appendChild(b);
    });
    body.appendChild(col);
  }
  grid.appendChild(body);
  wrap.appendChild(grid);
  return wrap;
}

  side.appendChild(el("div",{class:"card-cd"}, countdownCard(fromIso(ds))));

  side.appendChild(taskList(ds));
  grid.appendChild(side);
  return grid;
}

/* ---- session modal ----------------------------------------------------- */
let lastFocus = null;
/* Set by whoever opened the modal, to say what should happen when it closes.
   The day sheet uses it so that editing a class from inside the sheet returns
   to the sheet rather than dumping you back on the grid. It is read and cleared
   here so Escape and a scrim click behave exactly like the Cancel button. */
let modalAfter = null;
function closeModal(){
  const after = modalAfter;
  modalAfter = null;
  document.getElementById("modalroot").textContent = "";
  document.removeEventListener("keydown", modalKeys);
  if(after){ after(); return; }
  if(lastFocus && lastFocus.isConnected) lastFocus.focus();
}
function modalKeys(e){
  if(e.key==="Escape"){ e.preventDefault(); closeModal(); return; }
  if(e.key!=="Tab") return;
  const f = [...document.querySelectorAll(".modal button, .modal input, .modal select")].filter(x => !x.disabled);
  if(!f.length) return;
  const first = f[0], last = f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}

function sessionModal(session, dateStr, after){
  lastFocus = document.activeElement;
  const isNew = !session;
  const s = session || {id:"c"+Date.now(), date:dateStr, start:"08:00", end:"09:00",
                        title:"", category:"", instructor:"", kind:"lecture", mandatory:false, custom:true};

  const root = document.getElementById("modalroot");
  root.textContent = "";
  modalAfter = after || null;
  const scrim = el("div",{class:"scrim", onclick:e => { if(e.target===scrim) closeModal(); }});
  const modal = el("div",{class:"modal", role:"dialog", "aria-modal":"true", "aria-labelledby":"mtitle"});

  const d = fromIso(dateStr);
  modal.appendChild(el("header",{},[
    el("h3",{id:"mtitle", text:isNew?"Add to the day":"Edit this class"}),
    el("p",{text:`${DAYNAMES[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`})
  ]));

  const fields = el("div",{class:"fields"});
  const nameIn = el("input",{type:"text", value:s.label||s.title||"", placeholder:"e.g. Anatomy #8", id:"f-name"});
  fields.appendChild(el("div",{class:"field"},[el("label",{for:"f-name",text:"Name"}), nameIn]));

  const startIn = el("input",{type:"time", value:s.start||"08:00", id:"f-start"});
  const endIn   = el("input",{type:"time", value:s.end||"09:00", id:"f-end"});
  fields.appendChild(el("div",{class:"pair"},[
    el("div",{class:"field"},[el("label",{for:"f-start",text:"Starts"}), startIn]),
    el("div",{class:"field"},[el("label",{for:"f-end",text:"Ends"}), endIn])
  ]));

  const catSel = el("select",{id:"f-cat"});
  /* Pick the starting option honestly: the session's own category when the
     dropdown offers it, otherwise fall back by kind (Lunch -> Break, a raw
     "Labor Day" -> Other) rather than letting the browser default to whatever
     option happens to be first. */
  const curCat = (s.category||"").toUpperCase();
  const preSel = (curCat in THEMES.categories) ? curCat
               : s.kind === "break" ? "BREAK"
               : s.kind === "exam"  ? "EXAM"
               : "OTHER";
  Object.keys(THEMES.categories).forEach(k => {
    const o = el("option",{value:k, text:THEMES.categories[k].label});
    if(k === preSel) o.selected = true;
    catSel.appendChild(o);
  });
  const instrIn = el("input",{type:"text", value:s.instructor||"", placeholder:"Optional", id:"f-instr"});
  fields.appendChild(el("div",{class:"pair"},[
    el("div",{class:"field"},[el("label",{for:"f-cat",text:"Course"}), catSel]),
    el("div",{class:"field"},[el("label",{for:"f-instr",text:"Instructor"}), instrIn])
  ]));
  modal.appendChild(fields);

  const foot = el("footer",{});
  if(!isNew){
    /* One word and one behaviour for both kinds. "Delete" spliced a custom class
       out for good and "Hide" put a school one somewhere with no way back --
       two different promises on the same button, and one of them was a trap. */
    foot.appendChild(el("button",{class:"btn danger sm", type:"button", text:"Remove",
      onclick:() => {
        const k = stateKey(s, dateStr);
        if(!S.hidden.includes(k)) S.hidden.push(k);
        persist(); closeModal(); render();
        announce("Removed from the day. Restore it under Edit.");
      }}));
    if(!s.custom && S.sessionEdits[stateKey(s, dateStr)]){
      foot.appendChild(el("button",{class:"btn ghost sm", type:"button", text:"Reset",
        onclick:() => { delete S.sessionEdits[stateKey(s, dateStr)]; persist(); closeModal(); render();
                        announce("Reset to the block schedule."); }}));
    }
  }
  foot.appendChild(el("span",{class:"spacer"}));
  foot.appendChild(el("button",{class:"btn ghost", type:"button", text:"Cancel", onclick:closeModal}));
  foot.appendChild(el("button",{class:"btn", type:"button", text:isNew?"Add":"Save", onclick:() => {
    const chosen = catSel.value;
    const patch = {
      label: nameIn.value.trim() || s.label || s.title,
      title: nameIn.value.trim() || s.title,
      start: startIn.value, end: endIn.value,
      /* Whatever the dropdown says, save it -- including "Other". The old code
         special-cased "OTHER" back to the original category, so you could never
         actually move a class to Other. */
      category: chosen,
      instructor: instrIn.value.trim(),
      /* Course choice drives kind too: pick Exam/Break and it becomes one; pick
         a real course for something that was an Exam or Break and it turns back
         into a normal class instead of staying styled as the old kind. */
      kind: chosen === "EXAM" ? "exam"
          : chosen === "BREAK" ? "break"
          : (s.kind === "exam" || s.kind === "break") ? "lecture"
          : (s.kind || "lecture")
    };
    if(isNew || s.custom){
      const rec = Object.assign({}, s, patch, {date:dateStr, custom:true, mandatory:!!s.mandatory});
      S.addedSessions = S.addedSessions.filter(x => x.id!==s.id).concat([rec]);
    }else{
      S.sessionEdits[stateKey(s, dateStr)] = patch;
    }
    persist(); closeModal(); render();
    announce(isNew ? "Class added." : "Class updated.");
  }}));
  modal.appendChild(foot);

  scrim.appendChild(modal);
  root.appendChild(scrim);
  document.addEventListener("keydown", modalKeys);
  nameIn.focus();
}

/* ---- day sheet ---------------------------------------------------------
   What the month and the week open when the grid's Edit is on. Neither of those
   two can carry a control per class: a month cell is 45px wide on a phone and a
   week block can be 22px tall. This list can, and it is the same four things the
   day view already offers -- add, edit, remove, restore -- so there is one thing
   to learn rather than three.
   ------------------------------------------------------------------------ */
function dayEditor(dateStr){
  lastFocus = document.activeElement;
  const root = document.getElementById("modalroot");
  root.textContent = "";
  modalAfter = null;
  const back = () => dayEditor(dateStr);          // where the session modal returns to
  const d = fromIso(dateStr);

  const scrim = el("div",{class:"scrim", onclick:e => { if(e.target===scrim) closeModal(); }});
  const modal = el("div",{class:"modal", role:"dialog", "aria-modal":"true", "aria-labelledby":"mtitle"});
  modal.appendChild(el("header",{},[
    el("h3",{id:"mtitle", text:"Edit this day"}),
    el("p",{text:`${DAYNAMES[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`})
  ]));

  const fields = el("div",{class:"fields"});
  const list = sessionsFor(dateStr);
  if(!list.length){
    fields.appendChild(el("div",{class:"empty"},[
      el("strong",{text:"Nothing on this day."}),
      "Add a class and it shows up everywhere — here, the week, and the day’s own page."
    ]));
  }else{
    const ul = el("ul",{class:"sheet"});
    list.forEach(s => {
      const li = el("li",{});
      const pick = el("button",{
        class:"pick", type:"button", style:`--cat:var(--cat-${cssKey(catColor(s))})`,
        "aria-label":`Edit “${sessName(s)}”`,
        onclick:() => sessionModal(s, dateStr, back)
      });
      pick.appendChild(el("b",{text:sessName(s)}));
      pick.appendChild(el("small",{text: s.start && s.end
        ? `${fmtTime(s.start)} – ${fmtTime(s.end)}` : "No time set"}));
      li.appendChild(pick);
      li.appendChild(rmBtn(`Remove “${sessStamp(s)}” from this day`, () => hideSession(s, dateStr, back)));
      ul.appendChild(li);
    });
    fields.appendChild(ul);
  }

  const strip = restoreStrip("Removed from this day",
    hiddenFor(dateStr).map(s => ({text:sessStamp(s), undo:() => unhideSession(s, dateStr, back)})));
  if(strip) fields.appendChild(strip);
  modal.appendChild(fields);

  const foot = el("footer",{});
  foot.appendChild(el("button",{class:"btn ghost sm", type:"button", text:"Open this day",
    onclick:() => { cursor = fromIso(dateStr); modalAfter = null; closeModal(); setView("day"); }}));
  foot.appendChild(el("span",{class:"spacer"}));
  foot.appendChild(el("button",{class:"btn ghost", type:"button", text:"Done", onclick:closeModal}));
  foot.appendChild(el("button",{class:"btn", type:"button", text:"Add a class",
    onclick:() => sessionModal(null, dateStr, back)}));
  modal.appendChild(foot);

  scrim.appendChild(modal);
  root.appendChild(scrim);
  document.addEventListener("keydown", modalKeys);
  const first = modal.querySelector(".sheet .pick") || modal.querySelector("footer .btn");
  if(first) first.focus();
}

/* ---- shell ------------------------------------------------------------- */
/* ?view= and ?date= make any day or week a shareable link, and let the
   pre-term / mid-term states be checked without waiting for the calendar. */
const wantView = new URLSearchParams(location.search).get("view");
let view = ["month","week","day"].includes(wantView) ? wantView : "month";
function setView(v){
  view = v;
  const u = new URL(location.href);
  u.searchParams.set("view", v);
  u.searchParams.set("date", iso(cursor));
  history.replaceState(null, "", u);
  render();
}

function render(){
  renderToday();
  document.querySelectorAll(".views button").forEach(b => {
    const on = b.dataset.view===view;
    b.setAttribute("aria-selected", String(on));
    b.tabIndex = on ? 0 : -1;
  });
  /* Hidden on the day view on purpose: that view already carries its own two
     Edit buttons, over the two columns they act on. A third one in the bar with
     nothing left to do would read as broken. */
  const ge = document.getElementById("gridedit");
  ge.hidden = (view === "day");
  ge.textContent = EDIT.grid ? "Done" : "Edit";
  ge.className = "btn ghost sm" + (EDIT.grid ? " on" : "");
  ge.setAttribute("aria-pressed", String(EDIT.grid));
  ge.setAttribute("aria-label", EDIT.grid ? "Finish editing the calendar" : "Edit the calendar");

  const main = document.getElementById("main");
  main.textContent = "";
  if(EDIT.grid && view !== "day") main.appendChild(el("p",{class:"edithint gridhint",
    text: view === "month"
      ? "Tap any day to add, change or remove its classes."
      : "Use Edit over a day to add, change or remove its classes — or tap a class straight in the grid."}));
  const ttl = document.getElementById("rangettl");
  if(view==="month"){
    ttl.textContent = `${MONTHS[cursor.getMonth()]} ${cursor.getFullYear()}`;
    main.appendChild(renderMonth());
  }else if(view==="week"){
    const s = startOfWeek(cursor), e = addDays(s,6);
    ttl.textContent = s.getMonth()===e.getMonth()
      ? `${MONTHS[s.getMonth()]} ${s.getDate()} – ${e.getDate()}`
      : `${MONTHS[s.getMonth()].slice(0,3)} ${s.getDate()} – ${MONTHS[e.getMonth()].slice(0,3)} ${e.getDate()}`;
    main.appendChild(renderWeek());
  }else{
    ttl.textContent = `${DAYNAMES[cursor.getDay()]}, ${MONTHS[cursor.getMonth()]} ${cursor.getDate()}`;
    main.appendChild(renderDay());
  }
}

function step(dir){
  if(view==="month") cursor = new Date(cursor.getFullYear(), cursor.getMonth()+dir, 1);
  else if(view==="week") cursor = addDays(cursor, 7*dir);
  else cursor = addDays(cursor, dir);
  render();
}

document.querySelectorAll(".views button").forEach(b => {
  b.addEventListener("click", () => setView(b.dataset.view));
  b.addEventListener("keydown", e => {
    const order = ["month","week","day"];
    const i = order.indexOf(view);
    if(e.key==="ArrowRight"){ e.preventDefault(); setView(order[(i+1)%3]); document.getElementById("tab-"+order[(i+1)%3]).focus(); }
    if(e.key==="ArrowLeft"){ e.preventDefault(); setView(order[(i+2)%3]); document.getElementById("tab-"+order[(i+2)%3]).focus(); }
  });
});
document.getElementById("prev").addEventListener("click", () => step(-1));
document.getElementById("next").addEventListener("click", () => step(1));
document.getElementById("gotoday").addEventListener("click", () => { cursor = new Date(TODAY); render(); announce("Jumped to today."); });
document.getElementById("gridedit").addEventListener("click", () => setEdit("grid", !EDIT.grid));

document.getElementById("brandsub").textContent =
  `${DATA.meta.block} · ${MONTHS[TERM_START.getMonth()]} ${TERM_START.getDate()} – ${MONTHS[TERM_END.getMonth()]} ${TERM_END.getDate()}, ${TERM_END.getFullYear()}`;
document.getElementById("foot").textContent =
  `Built from “${DATA.meta.source_pdf}” · parsed ${DATA.meta.parsed_at.replace("T"," ")} · your edits are saved in this browser`;

buildSwatches();
buildLegend();
applyTheme(S.theme);
/* Opening on a month with nothing in it is a dead first impression, so before
   the block starts the grid lands on the first taught month instead. */
cursor = (TODAY < TERM_START) ? new Date(TERM_START)
       : (TODAY > TERM_END)   ? new Date(TERM_END)
       : new Date(TODAY);
/* A ?date= in the URL parks the lower half there -- that is the deep link, and
   it is what setView writes back. It cannot touch TODAY. */
if(isDate(qs.get("date"))) cursor = fromIso(qs.get("date"));
else if(todayOverride) cursor = new Date(TODAY);
render();
</script>
